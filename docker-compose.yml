# Run BUBER locally with one command:  docker compose up --build
# Then open http://localhost:3000  (demo password for all accounts: buber1234)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: buber
      POSTGRES_PASSWORD: buber
      POSTGRES_DB: buber
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buber"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://buber:buber@db:5432/buber?schema=public
      SEED_DEMO_IF_EMPTY: "true"
    ports:
      - "3000:3000"
    volumes:
      - media:/data

volumes:
  pgdata:
  media:
