<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script>
// Generative "beauty" art used for BUBER sample content.
// Every scene is a pure function of (t, W, H, palette) so frames are deterministic.
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W = 540, H = 960, S = 1;

function rng(seed) {
  let s = seed >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

let grain = null;
function makeGrain() {
  grain = document.createElement("canvas");
  grain.width = 256; grain.height = 256;
  const g = grain.getContext("2d");
  const img = g.createImageData(256, 256);
  const r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = r() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 22;
  }
  g.putImageData(img, 0, 0);
}

function setup(w, h) {
  W = w; H = h; S = Math.min(W, H) / 540;
  cv.width = W; cv.height = H;
  if (!grain) makeGrain();
}

function bg(c1, c2) {
  const g = ctx.createLinearGradient(0, 0, W * 0.3, H);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// Soft window light beams, like late-afternoon sun through blinds.
function windowLight(t, alpha = 0.16) {
  ctx.save();
  ctx.globalCompositeOperation = "soft-light";
  ctx.translate(W * 0.5, H * 0.5);
  ctx.rotate(-0.55);
  const drift = Math.sin(t * 0.35) * 40 * S;
  for (let i = -3; i <= 3; i++) {
    const x = i * 120 * S + drift;
    const g = ctx.createLinearGradient(x - 40 * S, 0, x + 40 * S, 0);
    g.addColorStop(0, "rgba(255,240,215,0)");
    g.addColorStop(0.5, `rgba(255,240,215,${alpha * 3})`);
    g.addColorStop(1, "rgba(255,240,215,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - 40 * S, -H, 80 * S, H * 2);
  }
  ctx.restore();
}

function finish() {
  // vignette + grain
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(20,10,5,0.55)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = ctx.createPattern(grain, "repeat");
  ctx.fillRect(0, 0, W, H);
}

// ---------- Scenes ----------

function nails(t, p) {
  bg(p.bg1, p.bg2);
  windowLight(t);
  const n = 5;
  const baseY = H * 1.02;
  for (let i = 0; i < n; i++) {
    const f = (i - (n - 1) / 2);
    const ang = f * 0.13 + Math.sin(t * 0.8 + i) * 0.015;
    const len = (H * 0.48) * (1 - Math.abs(f) * 0.08) * (i === 0 ? 0.8 : 1);
    const wFinger = 92 * S;
    ctx.save();
    ctx.translate(W / 2 + f * 104 * S, baseY);
    ctx.rotate(ang);
    // finger
    const sk = ctx.createLinearGradient(-wFinger / 2, 0, wFinger / 2, 0);
    sk.addColorStop(0, p.skinDark); sk.addColorStop(0.45, p.skin); sk.addColorStop(1, p.skinDark);
    ctx.fillStyle = sk;
    ctx.shadowColor = "rgba(40,20,10,0.35)"; ctx.shadowBlur = 30 * S; ctx.shadowOffsetX = 10 * S;
    roundRect(-wFinger / 2, -len, wFinger, len + 40 * S, wFinger / 2);
    ctx.fill();
    ctx.shadowColor = "transparent";
    // nail (almond)
    const nw = wFinger * 0.74, nh = 118 * S;
    const ny = -len + 6 * S;
    ctx.beginPath();
    ctx.moveTo(-nw / 2, ny + nh);
    ctx.bezierCurveTo(-nw / 2, ny + nh * 0.35, -nw * 0.18, ny - nh * 0.18, 0, ny - nh * 0.22);
    ctx.bezierCurveTo(nw * 0.18, ny - nh * 0.18, nw / 2, ny + nh * 0.35, nw / 2, ny + nh);
    ctx.quadraticCurveTo(0, ny + nh * 1.08, -nw / 2, ny + nh);
    const shift = (Math.sin(t * 0.9 + i * 0.6) + 1) / 2;
    const pg = ctx.createLinearGradient(-nw / 2, ny, nw / 2, ny + nh);
    pg.addColorStop(0, p.polish[0]);
    pg.addColorStop(0.3 + shift * 0.4, p.polish[1]);
    pg.addColorStop(1, p.polish[2]);
    ctx.fillStyle = pg;
    ctx.fill();
    if (p.french) {
      ctx.save(); ctx.clip();
      ctx.fillStyle = "rgba(255,250,244,0.92)";
      ctx.beginPath(); ctx.ellipse(0, ny - nh * 0.05, nw * 0.7, nh * 0.32, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // specular streak
    ctx.save(); ctx.clip();
    const sx = -nw / 2 + ((t * 0.45 + i * 0.13) % 1.4) * nw * 1.2;
    const sg = ctx.createLinearGradient(sx - 8 * S, 0, sx + 8 * S, 0);
    sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(0.5, "rgba(255,255,255,0.75)"); sg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sg; ctx.fillRect(sx - 8 * S, ny - nh, 16 * S, nh * 2.5);
    ctx.restore();
    ctx.restore();
  }
  sparkles(t, p.spark || "rgba(255,240,220,0.9)", 18, 3);
  finish();
}

function hair(t, p) {
  bg(p.bg1, p.bg2);
  const r = rng(p.seed || 3);
  const strands = 170;
  ctx.lineCap = "round";
  for (let i = 0; i < strands; i++) {
    const x0 = W * (-0.15 + r() * 1.3);
    const phase = r() * 6.28;
    const amp = (40 + r() * 70) * S;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, p.root);
    g.addColorStop(0.45 + r() * 0.15, p.mid);
    g.addColorStop(1, p.ends);
    ctx.strokeStyle = g;
    ctx.globalAlpha = 0.35 + r() * 0.5;
    ctx.lineWidth = (1.2 + r() * 3.2) * S;
    ctx.beginPath();
    ctx.moveTo(x0, -20 * S);
    const k = t * (0.8 + r() * 0.4);
    for (let y = 0; y <= H + 40 * S; y += 24 * S) {
      const yy = y / H;
      const x = x0 + Math.sin(yy * 4 + k + phase) * amp * yy + Math.sin(yy * 9 + k * 1.6) * 8 * S * yy;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // gloss band
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  const gy = H * (0.35 + 0.08 * Math.sin(t * 0.7));
  const gb = ctx.createLinearGradient(0, gy - 70 * S, 0, gy + 70 * S);
  gb.addColorStop(0, "rgba(255,230,190,0)"); gb.addColorStop(0.5, "rgba(255,230,190,0.28)"); gb.addColorStop(1, "rgba(255,230,190,0)");
  ctx.fillStyle = gb; ctx.fillRect(0, gy - 70 * S, W, 140 * S);
  ctx.restore();
  windowLight(t, 0.1);
  finish();
}

function braid(t, p) {
  bg(p.bg1, p.bg2);
  windowLight(t, 0.12);
  const cx = W / 2;
  const scroll = (t * 60 * S) % (180 * S);
  for (let s = 0; s < 3; s++) {
    const phase = (s * Math.PI * 2) / 3;
    for (let layer = 0; layer < 2; layer++) {
      ctx.beginPath();
      for (let y = -200 * S; y < H + 200 * S; y += 6 * S) {
        const yy = y + scroll;
        const x = cx + Math.sin(yy / (60 * S) + phase) * 90 * S;
        // draw only when this strand is "in front"
        const front = Math.cos(yy / (60 * S) + phase) > 0;
        if (front === (layer === 1)) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      const g = ctx.createLinearGradient(cx - 120 * S, 0, cx + 120 * S, 0);
      g.addColorStop(0, p.ends); g.addColorStop(0.5, p.mid); g.addColorStop(1, p.root);
      ctx.strokeStyle = g;
      ctx.lineWidth = 62 * S;
      ctx.lineCap = "round";
      ctx.shadowColor = "rgba(30,15,5,0.45)"; ctx.shadowBlur = 18 * S;
      ctx.stroke();
      ctx.shadowColor = "transparent";
      // strand texture
      ctx.strokeStyle = "rgba(255,235,200,0.18)"; ctx.lineWidth = 2 * S; ctx.stroke();
    }
  }
  sparkles(t, "rgba(255,236,210,0.8)", 10, 4);
  finish();
}

function fade(t, p) {
  bg(p.bg1, p.bg2);
  const r = rng(11);
  const line = H * (0.62 - 0.05 * Math.sin(t * 0.6));
  for (let i = 0; i < 2600; i++) {
    const x = r() * W;
    const y = r() * H;
    const density = Math.min(1, Math.max(0, (y - H * 0.15) / (H * 0.7)));
    if (r() > density) continue;
    ctx.strokeStyle = `rgba(${p.dot},${0.25 + density * 0.5})`;
    ctx.lineWidth = 1.4 * S;
    const l = (2 + density * 7) * S;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 1.5 * S, y - l); ctx.stroke();
  }
  // clipper pass highlight
  const g = ctx.createLinearGradient(0, line - 60 * S, 0, line + 60 * S);
  g.addColorStop(0, "rgba(255,226,180,0)"); g.addColorStop(0.5, "rgba(255,226,180,0.22)"); g.addColorStop(1, "rgba(255,226,180,0)");
  ctx.fillStyle = g; ctx.fillRect(0, line - 60 * S, W, 120 * S);
  // sharp line-up
  ctx.strokeStyle = p.accent; ctx.lineWidth = 3 * S;
  ctx.beginPath();
  ctx.moveTo(W * 0.12, H * 0.3); ctx.lineTo(W * 0.5, H * 0.24 + Math.sin(t) * 4 * S); ctx.lineTo(W * 0.88, H * 0.3);
  ctx.stroke();
  // comb
  ctx.save();
  ctx.translate(W * (0.15 + ((t * 0.12) % 0.7)), H * 0.8);
  ctx.rotate(-0.2);
  ctx.fillStyle = p.accent;
  roundRect(0, 0, 210 * S, 26 * S, 6 * S); ctx.fill();
  for (let k = 0; k < 26; k++) ctx.fillRect(6 * S + k * 7.8 * S, 26 * S, 3.2 * S, 46 * S);
  ctx.restore();
  windowLight(t, 0.1);
  finish();
}

function blowout(t, p) {
  bg(p.bg1, p.bg2);
  const r = rng(5);
  const cx = W * 0.5, cy = H * 0.48;
  ctx.lineCap = "round";
  for (let i = 0; i < 140; i++) {
    const rad = (60 + r() * 330) * S;
    const start = r() * 6.28 + t * (0.25 + r() * 0.2);
    const len = 0.9 + r() * 1.6;
    const g = ctx.createLinearGradient(cx - rad, cy - rad, cx + rad, cy + rad);
    g.addColorStop(0, p.root); g.addColorStop(0.5, p.mid); g.addColorStop(1, p.ends);
    ctx.strokeStyle = g;
    ctx.globalAlpha = 0.35 + r() * 0.5;
    ctx.lineWidth = (2 + r() * 6) * S;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rad, rad * 1.25, 0.3, start, start + len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  const hg = ctx.createRadialGradient(cx - 80 * S, cy - 120 * S, 10, cx - 80 * S, cy - 120 * S, 260 * S);
  hg.addColorStop(0, "rgba(255,236,205,0.45)"); hg.addColorStop(1, "rgba(255,236,205,0)");
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  windowLight(t, 0.12);
  finish();
}

function palette(t, p) {
  bg(p.bg1, p.bg2);
  windowLight(t, 0.14);
  const cols = 3, rows = 3;
  const size = 128 * S, gap = 26 * S;
  const ox = (W - (cols * size + (cols - 1) * gap)) / 2;
  const oy = (H - (rows * size + (rows - 1) * gap)) / 2;
  ctx.save();
  ctx.fillStyle = "rgba(25,15,10,0.85)";
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 40 * S;
  roundRect(ox - 34 * S, oy - 34 * S, cols * size + (cols - 1) * gap + 68 * S, rows * size + (rows - 1) * gap + 68 * S, 28 * S);
  ctx.fill();
  ctx.restore();
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const c = p.pans[(j * cols + i) % p.pans.length];
    const x = ox + i * (size + gap) + size / 2, y = oy + j * (size + gap) + size / 2;
    const a = t * 0.8 + i + j;
    const g = ctx.createRadialGradient(x + Math.cos(a) * 30 * S, y + Math.sin(a) * 30 * S, 4, x, y, size * 0.6);
    g.addColorStop(0, "rgba(255,255,255,0.85)");
    g.addColorStop(0.25, c);
    g.addColorStop(1, shade(c, -0.35));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, size / 2, 0, Math.PI * 2); ctx.fill();
  }
  sparkles(t, "rgba(255,230,200,0.95)", 40, 2.4);
  finish();
}

function lashes(t, p) {
  bg(p.bg1, p.bg2);
  windowLight(t, 0.14);
  const cx = W / 2, cy = H * 0.52, ew = 210 * S;
  // closed lid curve
  ctx.strokeStyle = p.liner; ctx.lineWidth = 6 * S; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx - ew, cy);
  ctx.quadraticCurveTo(cx, cy + 70 * S, cx + ew, cy - 10 * S);
  ctx.stroke();
  const grow = 0.85 + 0.15 * Math.sin(t * 1.2);
  for (let i = 0; i <= 34; i++) {
    const u = i / 34;
    const x = (1 - u) * (1 - u) * (cx - ew) + 2 * (1 - u) * u * cx + u * u * (cx + ew);
    const y = (1 - u) * (1 - u) * cy + 2 * (1 - u) * u * (cy + 70 * S) + u * u * (cy - 10 * S);
    const L = (40 + 70 * Math.sin(Math.PI * u)) * S * grow;
    const ang = Math.PI / 2 + (u - 0.6) * 1.1;
    ctx.lineWidth = 2.6 * S;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(ang) * L * 0.5 + 12 * S, y + Math.sin(ang) * L * 0.6, x + Math.cos(ang) * L + 22 * S, y + Math.sin(ang) * L);
    ctx.stroke();
  }
  // brow
  ctx.strokeStyle = p.brow; ctx.lineWidth = 2 * S;
  const r = rng(2);
  for (let i = 0; i < 120; i++) {
    const u = r();
    const x = cx - ew * 0.95 + u * ew * 1.95;
    const y = cy - 190 * S - Math.sin(u * Math.PI * 0.85) * 55 * S + (r() - 0.5) * 22 * S;
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 18 * S, y - 7 * S - u * 6 * S); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  sparkles(t, "rgba(255,240,225,0.7)", 12, 2.5);
  finish();
}

function sparkles(t, color, count, size) {
  const r = rng(99 + count);
  for (let i = 0; i < count; i++) {
    const x = r() * W, y = r() * H, ph = r() * 6.28;
    const a = Math.max(0, Math.sin(t * 2.2 + ph));
    if (a < 0.2) continue;
    ctx.fillStyle = color;
    ctx.globalAlpha = a;
    const s = size * S * (0.6 + a);
    ctx.beginPath();
    ctx.moveTo(x, y - s * 3); ctx.lineTo(x + s * 0.6, y); ctx.lineTo(x, y + s * 3); ctx.lineTo(x - s * 0.6, y); ctx.closePath();
    ctx.moveTo(x - s * 3, y); ctx.lineTo(x, y + s * 0.6); ctx.lineTo(x + s * 3, y); ctx.lineTo(x, y - s * 0.6); ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => Math.max(0, Math.min(255, Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

const SCENES = { nails, hair, braid, fade, blowout, palette, lashes };

window.render = (scene, t, palette, w, h) => {
  if (W !== w || H !== h || cv.width !== w) setup(w, h);
  ctx.save();
  SCENES[scene](t, palette);
  ctx.restore();
};

// Monogram avatar
window.avatar = (letter, c1, c2, size) => {
  setup(size, size);
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = "rgba(255,248,238,0.95)";
  ctx.font = `600 ${size * 0.42}px Heebo, Arial, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(letter, size / 2, size / 2 + size * 0.03);
  ctx.fillStyle = ctx.createPattern(grain, "repeat"); ctx.fillRect(0, 0, size, size);
};
</script>
</body>
</html>
